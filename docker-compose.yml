version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bombotwerk-postgres
    ports:
      - '5433:5432' # Exposed on VPS port 5433 for external debugging, internal port remains 5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bombotwerk-backend
    ports:
      - '4000:4000' # Exposed NestJS port
    env_file:
      - .env.production
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
