services:
  postgres:
    image: postgres:15-alpine
    container_name: bombotwerk-postgres
    ports:
      - '5433:5432' # Exposed on VPS port 5433 for external debugging, internal port remains 5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bombotwerk-backend
    ports:
      - '4000:4000' # Exposed NestJS port
    env_file:
      - .env.production
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    depends_on:
      - postgres
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: bombotwerk-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  caddy_data:
  caddy_config:
